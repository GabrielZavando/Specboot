name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Framework self-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install framework deps
        run: npm install
      - name: check-refs
        run: bash check-refs.sh
      - name: specboot ci (dogfooding)
        run: bash specboot.sh --ci
      - name: Run framework self-tests (dogfooding)
        if: ${{ hashFiles('tests/check-refs-test.sh', 'tests/solid-templates-test.sh', 'tests/update-test.sh') != '' }}
        run: |
          bash tests/check-refs-test.sh
          bash tests/solid-templates-test.sh
          bash tests/update-test.sh

  project-ci:
    name: Project CI gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install framework deps
        run: npm install
      - name: make ci (refs + solid-lint + lint + test + audit)
        run: make ci
