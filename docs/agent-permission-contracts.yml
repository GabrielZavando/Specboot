# Agent Permission Contracts — SPECBOOT-PERM-01
#
# Fuente de verdad declarativa de los contratos de permisos de los agentes
# OpenCode de Specboot. El validador
# (scripts/validate-agent-permissions.mjs) calcula los permisos efectivos de
# cada `.opencode/agents/*.md` respetando la semántica `last-match-wins` de
# OpenCode y los compara contra este manifiesto. Ninguna capacidad se infiere
# desde prosa libre.
#
# Estructura por agente:
#   edit.allow        — rutas que el agente PUEDE modificar (conjunto exacto).
#   edit.forbidden    — patrones que deben resolver efectivamente a deny.
#   edit.mode         — "restricted" (solo lo declarado en edit.allow) o
#                       "implementer" (allow general, menos lo prohibido).
#   bash.required     — comandos que deben resolver efectivamente a allow.
#   bash.forbidden    — comandos que deben resolver efectivamente a deny.
#   evidence.must_write — archivos de evidencia que el agente persiste (fail-closed).
#   can_commit / can_push / can_manage_prs / can_run_arbitrary_code /
#   can_spawn_subagents — flags booleanos obligatorios.
#   task.allow / task.forbidden — contrato de subagentes (SPECBOOT-HARDEN-02,
#   REQ-005): build solo invoca backend/frontend; los demás no lanzan subagentes.
#
# Decisión de wrapper (SPECBOOT-HARDEN-02, REQ-006): se evaluó un wrapper seguro
# de `git push` para el agente commit; se retiene la denegación PATTERN-BASED
# estructural (todas las variantes force + comandos compuestos que embeben git
# de escritura en un segmento no inicial, con separadores `;`, `&&`, `||`, `|`
# y newline, con y sin espacios) porque el validador la audita automáticamente
# con esa cobertura EXACTA (ni más ni menos); un wrapper real queda como
# hardening futuro si se reintroduce una variante no cubierta. Los agentes
# implementadores prefieren allowlists de Git de solo lectura: los comandos de
# escritura git (add/commit/push y compuestos) resuelven deny.
#
# Límite de la frontera (defensa en profundidad — SPECBOOT-HARDEN-02, REQ-006):
# cuando can_run_arbitrary_code es true (build/backend/frontend), las
# denegaciones pattern-based son defensa contra ERRORES ACCIDENTALES, no una
# frontera de seguridad frente a EVASIÓN DELIBERADA: un wrapper como
# `bash -c`, `node -e`, un subshell `$(...)` o backticks podría ejecutar git de
# escritura sin que ningún patrón lo intercepte (OpenCode matchea el string del
# comando, no desenvuelve procesos). La denegación de `node -e *`/
# `python -c *` en agentes con can_run_arbitrary_code=false acota ese canal
# allí donde la capacidad no está concedida; donde sí lo está, el límite real
# es el flag mismo, no el patrón.

version: 1

agents:

  verify:
    mode: primary
    edit:
      mode: restricted
      allow:
        - "openspec/state/verify-results.json"
      forbidden:
        - "docs/**"
        - "src/**"
        - "tasks.md"
        - "openspec/state/adversarial-result.json"
    bash:
      required:
        - "openspec validate *"
        - "git diff"
        - "git diff *"
        - "git status"
        - "git status *"
        - "git log"
        - "git log *"
        - "git merge-base *"
        - "npm test"
        - "npm test *"
        - "npm run test *"
        - "npx vitest *"
        - "npx jest *"
        - "pytest *"
        - "bash tests/*"
        - "bash scripts/*"
        - "date *"
        - "rg *"
        - "ls *"
        - "mkdir -p openspec/state"
      forbidden:
        - "git add"
        - "git add *"
        - "git commit"
        - "git commit *"
        - "git push"
        - "git push *"
        - "git push --force*"
        - "git push --force-with-lease*"
        - "git push -f*"
        - "git push *-f*"
        - "node -e *"
        - "python -c *"
        - "python3 -c *"
        - "sed -i *"
        - "tee *"
    evidence:
      must_write:
        - "openspec/state/verify-results.json"
    can_commit: false
    can_push: false
    can_manage_prs: false
    can_run_arbitrary_code: false
    can_spawn_subagents: false
    task:
      allow: []
      forbidden:
        - "*"

  reviewer:
    mode: subagent
    edit:
      mode: restricted
      allow:
        - "openspec/state/adversarial-result.json"
      forbidden:
        - "docs/**"
        - "src/**"
        - "tests/**"
        - "tasks.md"
        - "openspec/specs/**"
        - "openspec/state/verify-results.json"
    bash:
      required:
        - "npm audit *"
        - "npx eslint *"
        - "npx dependency-cruiser *"
        - "git diff"
        - "git diff *"
        - "git status"
        - "git status *"
        - "ls *"
        - "mkdir -p openspec/state"
        - "date -u *"
      forbidden:
        - "git add"
        - "git add *"
        - "git commit"
        - "git commit *"
        - "git push"
        - "git push *"
        - "git push --force*"
        - "git push --force-with-lease*"
        - "git push -f*"
        - "git push *-f*"
        - "node -e *"
        - "python -c *"
        - "python3 -c *"
        - "sed -i *"
        - "tee *"
    evidence:
      must_write:
        - "openspec/state/adversarial-result.json"
    can_commit: false
    can_push: false
    can_manage_prs: false
    can_run_arbitrary_code: false
    can_spawn_subagents: false
    task:
      allow: []
      forbidden:
        - "*"

  commit:
    mode: primary
    edit:
      mode: restricted
      allow: []
      forbidden:
        - "*"
    bash:
      required:
        - "git status"
        - "git status *"
        - "git diff"
        - "git diff *"
        - "git log"
        - "git log *"
        - "git fetch *"
        - "git merge-base *"
        - "git branch"
        - "git branch --show-current"
        - "git add *"
        - "git commit *"
        - "git push"
        - "git push *"
        - "gh pr create *"
        - "gh pr view *"
        - "gh pr edit *"
        - "node scripts/read-json-field.mjs *"
        - "ls *"
      forbidden:
        - "git push --force*"
        - "git push --force-with-lease*"
        - "git push -f*"
        - "git push *-f*"
        - "node -e *"
        - "python -c *"
        - "python3 -c *"
        - "sed -i *"
        - "tee *"
    evidence:
      must_write: []
    can_commit: true
    can_push: true
    can_manage_prs: true
    can_run_arbitrary_code: false
    can_spawn_subagents: false
    task:
      allow: []
      forbidden:
        - "*"

  archive:
    mode: primary
    edit:
      mode: restricted
      allow:
        - "openspec/**"
      forbidden: []
    bash:
      required:
        - "openspec archive *"
        - "git status"
        - "git status *"
        - "git diff"
        - "git diff *"
        - "git log"
        - "git log *"
        - "node scripts/read-json-field.mjs *"
        - "ls *"
        - "cat *"
        - "mkdir -p openspec/state"
        - "rm openspec/tickets/*"
        - "rm -f openspec/tickets/*"
        - "date -u *"
      forbidden:
        - "git add"
        - "git add *"
        - "git commit"
        - "git commit *"
        - "git push"
        - "git push *"
        - "git push --force*"
        - "git push --force-with-lease*"
        - "git push -f*"
        - "git push *-f*"
        - "node -e *"
        - "python -c *"
        - "python3 -c *"
        - "sed -i *"
        - "tee *"
    evidence:
      must_write: []
    can_commit: false
    can_push: false
    can_manage_prs: false
    can_run_arbitrary_code: false
    can_spawn_subagents: false
    task:
      allow: []
      forbidden:
        - "*"

  sdd-plan:
    mode: primary
    edit:
      mode: restricted
      allow:
        - "openspec/**"
      forbidden: []
    bash:
      required:
        - "openspec *"
        - "git checkout"
        - "git checkout *"
        - "git switch"
        - "git switch *"
        - "git branch"
        - "git branch *"
        - "git status"
        - "git status *"
        - "git log *"
        - "git merge-base *"
      forbidden:
        - "git add"
        - "git add *"
        - "git commit"
        - "git commit *"
        - "git push"
        - "git push *"
        - "git push --force*"
        - "git push --force-with-lease*"
        - "git push -f*"
        - "git push *-f*"
        - "node -e *"
        - "python -c *"
        - "python3 -c *"
    evidence:
      must_write: []
    can_commit: false
    can_push: false
    can_manage_prs: false
    can_run_arbitrary_code: false
    can_spawn_subagents: false
    task:
      allow: []
      forbidden:
        - "*"

  sync-specs:
    mode: primary
    edit:
      mode: restricted
      allow:
        - "openspec/specs/**"
      forbidden: []
    bash:
      required:
        - "git status"
        - "git status *"
        - "git diff"
        - "git diff *"
        - "ls *"
      forbidden:
        - "git add"
        - "git add *"
        - "git commit"
        - "git commit *"
        - "git push"
        - "git push *"
        - "git push --force*"
        - "git push -f*"
        - "node -e *"
        - "python -c *"
        - "python3 -c *"
    evidence:
      must_write: []
    can_commit: false
    can_push: false
    can_manage_prs: false
    can_run_arbitrary_code: false
    can_spawn_subagents: false
    task:
      allow: []
      forbidden:
        - "*"

  build:
    mode: primary
    edit:
      mode: implementer
      allow:
        - "**"
      forbidden:
        - "openspec/state/verify-results.json"
        - "openspec/state/adversarial-result.json"
    bash:
      required: []
      forbidden:
        - "git add"
        - "git add *"
        - "git commit"
        - "git commit *"
        - "git push"
        - "git push *"
        - "git push --force*"
        - "git push --force-with-lease*"
        - "git push -f*"
        - "git push *-f*"
        - "gh pr create *"
        - "gh pr edit *"
        - "gh pr view *"
        - "gh pr *"
        - "*; git add*"
        - "* && git add*"
        - "*; git commit*"
        - "* && git commit*"
        - "*; git push*"
        - "* && git push*"
        - "*; git push --force*"
        - "* && git push --force*"
        # Compound separators WITHOUT surrounding spaces (validator coverage is
        # EXACT: `;`, `&&`, `||`, `|`, newline — each ± space; the spaced forms
        # above are subsumed but kept for explicit documentation).
        - "*;*git add*"
        - "*&&*git add*"
        - "*||*git add*"
        - "*|*git add*"
        - "*\n*git add*"
        - "*;*git commit*"
        - "*&&*git commit*"
        - "*||*git commit*"
        - "*|*git commit*"
        - "*\n*git commit*"
        - "*;*git push*"
        - "*&&*git push*"
        - "*||*git push*"
        - "*|*git push*"
        - "*\n*git push*"
    evidence:
      must_write: []
    can_commit: false
    can_push: false
    can_manage_prs: false
    can_run_arbitrary_code: true
    can_spawn_subagents: true
    task:
      allow:
        - backend
        - frontend
      forbidden:
        - "*"
    justification: |
      Agente implementador primario de /apply: necesita editar cualquier
      archivo del proyecto bajo TDD y ejecutar los toolchains del stack
      (tests, builds, linters). Aun así no puede crear commits ni hacer push
      (ownership exclusivo del agente commit), no puede forzar push en
      ninguna variante, no puede modificar las evidencias de verify/
      adversarial manualmente y las operaciones destructivas de shell quedan
      bajo confirmación del usuario.

  backend:
    mode: subagent
    edit:
      mode: implementer
      allow:
        - "**"
      forbidden:
        - "openspec/state/verify-results.json"
        - "openspec/state/adversarial-result.json"
    bash:
      required: []
      forbidden:
        - "git add"
        - "git add *"
        - "git commit"
        - "git commit *"
        - "git push"
        - "git push *"
        - "git push --force*"
        - "git push --force-with-lease*"
        - "git push -f*"
        - "git push *-f*"
        - "gh pr create *"
        - "gh pr edit *"
        - "gh pr view *"
        - "gh pr *"
        - "*; git add*"
        - "* && git add*"
        - "*; git commit*"
        - "* && git commit*"
        - "*; git push*"
        - "* && git push*"
        - "*; git push --force*"
        - "* && git push --force*"
        # Compound separators WITHOUT surrounding spaces (validator coverage is
        # EXACT: `;`, `&&`, `||`, `|`, newline — each ± space; the spaced forms
        # above are subsumed but kept for explicit documentation).
        - "*;*git add*"
        - "*&&*git add*"
        - "*||*git add*"
        - "*|*git add*"
        - "*\n*git add*"
        - "*;*git commit*"
        - "*&&*git commit*"
        - "*||*git commit*"
        - "*|*git commit*"
        - "*\n*git commit*"
        - "*;*git push*"
        - "*&&*git push*"
        - "*||*git push*"
        - "*|*git push*"
        - "*\n*git push*"
    evidence:
      must_write: []
    can_commit: false
    can_push: false
    can_manage_prs: false
    can_run_arbitrary_code: true
    can_spawn_subagents: false
    task:
      allow: []
      forbidden:
        - "*"
    justification: |
      Subagente implementador backend (NestJS/API/migraciones): requiere
      edición de código y ejecución de toolchains para cumplir TDD bajo
      /apply. Sin permiso de commit/push (ownership del agente commit), sin
      force-push en ninguna variante, sin escritura sobre las evidencias de
      verify/adversarial y con operaciones destructivas sujetas a
      confirmación.

  frontend:
    mode: subagent
    edit:
      mode: implementer
      allow:
        - "**"
      forbidden:
        - "openspec/state/verify-results.json"
        - "openspec/state/adversarial-result.json"
    bash:
      required: []
      forbidden:
        - "git add"
        - "git add *"
        - "git commit"
        - "git commit *"
        - "git push"
        - "git push *"
        - "git push --force*"
        - "git push --force-with-lease*"
        - "git push -f*"
        - "git push *-f*"
        - "gh pr create *"
        - "gh pr edit *"
        - "gh pr view *"
        - "gh pr *"
        - "*; git add*"
        - "* && git add*"
        - "*; git commit*"
        - "* && git commit*"
        - "*; git push*"
        - "* && git push*"
        - "*; git push --force*"
        - "* && git push --force*"
        # Compound separators WITHOUT surrounding spaces (validator coverage is
        # EXACT: `;`, `&&`, `||`, `|`, newline — each ± space; the spaced forms
        # above are subsumed but kept for explicit documentation).
        - "*;*git add*"
        - "*&&*git add*"
        - "*||*git add*"
        - "*|*git add*"
        - "*\n*git add*"
        - "*;*git commit*"
        - "*&&*git commit*"
        - "*||*git commit*"
        - "*|*git commit*"
        - "*\n*git commit*"
        - "*;*git push*"
        - "*&&*git push*"
        - "*||*git push*"
        - "*|*git push*"
        - "*\n*git push*"
    evidence:
      must_write: []
    can_commit: false
    can_push: false
    can_manage_prs: false
    can_run_arbitrary_code: true
    can_spawn_subagents: false
    task:
      allow: []
      forbidden:
        - "*"
    justification: |
      Subagente implementador frontend (Angular/Astro/UI): requiere edición
      de código y ejecución de toolchains para cumplir TDD bajo /apply. Sin
      permiso de commit/push (ownership del agente commit), sin force-push en
      ninguna variante, sin escritura sobre las evidencias de verify/
      adversarial y con operaciones destructivas sujetas a confirmación.
